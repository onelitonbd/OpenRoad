<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1020" />
    <meta
      name="description"
      content="Open Road - a browser-based 3D open world arcade driving game."
    />
    <!-- The game can be installed on a phone and played full screen. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Open Road" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Open Road</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root"></div>
      <div id="loading">
        <div class="menu-title">OPEN ROAD</div>
        <div class="loading-label">Loading...</div>
        <div class="bar"><i></i></div>
        <div class="tip">
          Tip: WASD to drive, SPACE to handbrake, C to change camera, R to reset the car.
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
